<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Montessori Playbook</title>
    <meta name="description" content="Panduan Montessori lengkap untuk orang tua dengan anak usia 0-5 tahun" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Playbook" />
    <meta name="theme-color" content="#38bdf8" />
    <link rel="preload" href="/fonts/baloo2-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Splash screen inline: cegah white flash sebelum JS hidup -->
    <style>
      html { background: #f0f7fb; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(180deg, #e0f2fe 0%, #f0f7fb 60%, #fdf9ef 100%);
        transition: opacity .25s ease;
      }
      #boot-splash.hide { opacity: 0; pointer-events: none; }
      #boot-splash .logo {
        width: 84px; height: 84px; border-radius: 26px;
        background: linear-gradient(135deg, #38bdf8, #0ea5e9);
        display: flex; align-items: center; justify-content: center;
        font-size: 44px; box-shadow: 0 8px 24px rgba(14,165,233,.35);
        animation: bob 1.6s ease-in-out infinite;
      }
      @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div class="logo">
        <svg viewBox="0 0 64 64" width="52" height="52" aria-hidden="true"><ellipse cx="24" cy="40" rx="16" ry="9" fill="#fff"/><ellipse cx="34" cy="30" rx="15" ry="12" fill="#fff"/><ellipse cx="46" cy="40" rx="14" ry="8" fill="#fff"/></svg>
      </div>
    </div>
    <div id="root">
      <!-- Prerendered app shell: tampil instan sebelum React hydrate (native-feel, LCP dari HTML) -->
      <header class="sticky top-0" style="background:rgba(240,249,255,.85);backdrop-filter:blur(12px);padding-top:max(env(safe-area-inset-top),8px)">
        <div style="padding:0 20px 8px;height:84px">
          <h1 style="font:700 30px/84px system-ui,-apple-system,sans-serif;color:#0369a1;margin:0">Hari Ini</h1>
        </div>
      </header>
      <main style="padding:8px 20px 112px">
        <div style="background:linear-gradient(135deg,#e0f2fe,#fdfaf3);border-radius:28px;padding:24px;text-align:center">
          <div style="width:96px;height:96px;margin:0 auto;border-radius:30px;background:linear-gradient(135deg,#7dd3fc,#0284c7);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(14,165,233,.35)">
            <svg viewBox="0 0 64 64" width="52" height="52" aria-hidden="true"><ellipse cx="24" cy="40" rx="16" ry="9" fill="#fff"/><ellipse cx="34" cy="30" rx="15" ry="12" fill="#fff"/><ellipse cx="46" cy="40" rx="14" ry="8" fill="#fff"/><path d="M14 16l2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5z" fill="#fde68a"/><path d="M50 10l1.5 3.8 3.8 1.5-3.8 1.5L50 20.6l-1.5-3.8-3.8-1.5 3.8-1.5L50 10z" fill="#fde68a"/></svg>
          </div>
          <div style="font:700 24px system-ui,-apple-system,sans-serif;color:#075985;margin-top:16px">Selamat datang!</div>
          <div style="height:14px;width:70%;margin:12px auto 0;border-radius:7px;background:#bae6fd"></div>
          <div style="height:14px;width:50%;margin:8px auto 0;border-radius:7px;background:#e0f2fe"></div>
          <div style="height:48px;width:60%;margin:18px auto 0;border-radius:24px;background:#0284c7"></div>
        </div>
      </main>
      <nav style="position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid #e0f2fe;display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)">
        <span style="padding:10px 0;text-align:center;font:500 11px system-ui;color:#0369a1"><svg viewBox="0 0 24 24" width="18" height="18" style="display:block;margin:0 auto 2px" fill="none" stroke="#0369a1" stroke-width="2"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Hari Ini</span>
        <span style="padding:10px 0;text-align:center;font:500 11px system-ui;color:#47586b"><svg viewBox="0 0 24 24" width="18" height="18" style="display:block;margin:0 auto 2px" fill="none" stroke="#47586b" stroke-width="2"><path d="M4 4h11a3 3 0 013 3v13H7a3 3 0 01-3-3V4z"/><path d="M8 4v16"/></svg>Playbook</span>
        <span style="padding:10px 0;text-align:center;font:500 11px system-ui;color:#47586b"><svg viewBox="0 0 24 24" width="18" height="18" style="display:block;margin:0 auto 2px" fill="none" stroke="#47586b" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6"/></svg>Jurnal</span>
        <span style="padding:10px 0;text-align:center;font:500 11px system-ui;color:#47586b"><svg viewBox="0 0 24 24" width="18" height="18" style="display:block;margin:0 auto 2px" fill="none" stroke="#47586b" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Progres</span>
        <span style="padding:10px 0;text-align:center;font:500 11px system-ui;color:#47586b"><svg viewBox="0 0 24 24" width="18" height="18" style="display:block;margin:0 auto 2px" fill="#47586b"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>Lainnya</span>
      </nav>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- SW registration via src/app/pwa.ts (sudah dipanggil di main.tsx); registerSW.js redundan dimatikan via plugin config -->
  </body>
</html>
